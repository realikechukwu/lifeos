<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>You’re offline — LifeOS</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f2f2f6; color: #111114; }
    main { width: min(100%, 400px); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    svg { width: 84px; height: 84px; margin-bottom: 8px; border-radius: 19px; box-shadow: 0 12px 32px rgb(88 71 230 / .32); }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
    p { margin: 0 0 12px; color: #62626b; font-size: 17px; line-height: 1.45; }
    button { appearance: none; min-height: 52px; padding: 0 28px; border: 0; border-radius: 14px; color: #fff; background: #5847e6; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f5f5f7; }
      p { color: #a1a1aa; }
      button { background: #6d5ef8; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="114" fill="#5847e6"/>
      <g fill="none" stroke="#fff9f0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M104 236 256 116 408 236"/>
        <path d="M364 201V146"/>
        <path d="M256 352C220 292 144 296 144 352C144 408 220 412 256 352C292 292 368 296 368 352C368 408 292 412 256 352Z"/>
      </g>
      <circle cx="196" cy="258" r="24" fill="#fff9f0"/>
      <circle cx="316" cy="258" r="24" fill="#fff9f0"/>
    </svg>
    <h1>You’re offline</h1>
    <p>LifeOS needs a connection to load your latest plans safely.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
