{% extends "base.html" %}
{% load ui %}
{% block title %}Notes — LifeOS{% endblock %}

{% block content %}
<header class="page-head">
  {% include "web/_menu_button.html" %}
  <div>
    <h1 class="page-title">Notes</h1>
  </div>
  <a href="{% url 'web:note_create' %}" class="icon-btn" aria-label="New note">{% icon "pencil" %}</a>
</header>

<div class="toolbar">
  <form class="search" method="get" action="{% url 'web:note_list' %}" role="search" data-live="#note-results">
    {% icon "search" 18 %}
    <label class="visually-hidden" for="noteSearch">Search notes</label>
    <input type="search" id="noteSearch" name="q" value="{{ current_q }}" placeholder="Search notes and lists" autocomplete="off" enterkeyhint="search">
    {% if current_category %}<input type="hidden" name="category" value="{{ current_category }}">{% endif %}
  </form>
</div>

{% include "web/_note_results.html" %}
{% endblock %}
