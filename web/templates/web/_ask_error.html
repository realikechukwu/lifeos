{% load ui %}
<div class="notice danger ask-error" id="askError-{{ failed_job.id }}" data-ask-error>
  {% icon "alert" 20 %}
  <div class="ask-error-body">
    <p>Something went wrong while replying.</p>
    {% if failed_job.thread_id %}
    <form method="post" action="{% url 'web:ask_retry' failed_job.id %}" data-ask-retry>
      {% csrf_token %}
      <button type="submit" class="btn btn-tinted">Retry</button>
    </form>
    {% endif %}
  </div>
</div>
