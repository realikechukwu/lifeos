<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5847e6">
  <title>You’re offline — Family Assistant</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f4fb; color: #1c1a2e; }
    main { width: min(100%, 430px); padding: 40px 32px; text-align: center; background: #fff; border: 1px solid #e6e3f2; border-radius: 24px; box-shadow: 0 16px 48px rgba(27,22,66,.12); }
    .mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 22px; color: #fff; background: linear-gradient(140deg,#8a7df9,#5847e6); box-shadow: 0 10px 24px rgba(88,71,230,.28); }
    .mark svg { width: 42px; height: 42px; }
    h1 { margin: 0 0 10px; font-size: 1.65rem; letter-spacing: -.03em; }
    p { margin: 0 0 26px; color: #6b6880; line-height: 1.55; }
    button { appearance: none; border: 0; border-radius: 999px; padding: 12px 24px; color: #fff; background: #5847e6; font: inherit; font-weight: 650; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #100e1c; color: #ece9f7; }
      main { background: #191627; border-color: #2b2740; box-shadow: 0 16px 52px rgba(0,0,0,.44); }
      p { color: #a29ebb; }
      button { background: #8a7df9; color: #14112b; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><path d="M10 30 29 13a4 4 0 0 1 6 0l19 17M16 27v23h32V27" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 44c-1-1-8-5-8-11a6 6 0 0 1 11-4 6 6 0 0 1 11 4c0 6-7 10-8 11l-3 3-3-3Z" fill="#6d5ef8"/></svg>
    </div>
    <h1>You’re offline</h1>
    <p>Family Assistant needs a connection to safely load your latest private information.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
